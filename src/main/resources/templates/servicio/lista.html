<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catálogo | UniMarket</title>
    <link th:replace="~{fragmentos/bootstrap :: styles}">
    <script type="importmap" th:inline="javascript">
    {
      "imports": {
        "preact": [[@{/js/vendor/preact-11.1.1/preact.mjs}]],
        "preact/hooks": [[@{/js/vendor/preact-11.1.1/hooks.mjs}]],
        "htm": [[@{/js/vendor/htm-3.1.1/htm.module.js}]]
      }
    }
    </script>
</head>
<body>
<header th:replace="~{fragmentos/encabezado :: encabezado('catalogo')}"></header>
<main class="container app-main">
    <div class="page-head">
        <h1>Servicios disponibles</h1>
        <p>Explora las ofertas de la comunidad universitaria.</p>
    </div>

    <div th:if="${aviso}" class="alert theme-warning mb-6" role="status">
        <p th:text="${aviso}">Este servicio ya no está disponible.</p>
        <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert" aria-label="Cerrar aviso"></button>
    </div>
    <div id="catalogo" th:data-api="@{/api/servicios}" th:data-url="@{/servicios}"></div>
    <script type="application/json" id="catalogo-inicial" th:inline="javascript">[[${catalogoInicial}]]</script>
    <noscript><p class="panel">Activa JavaScript para buscar y explorar los servicios.</p></noscript>
</main>
<script th:replace="~{fragmentos/bootstrap :: scripts}"></script>
<script type="module" th:src="@{/js/catalogo.js}"></script>
</body>
</html>
